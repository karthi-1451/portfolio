<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Non Technical Certificates — P Karthi</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
    <style>
      :root { --accent:#ECB914; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(120% 90% at 50% 0%, #181818, #050505 60%); color:#ECECEC; font-family:"DM Mono",monospace; text-align:center; padding:2rem; animation:fade .8s ease both; }
      @keyframes fade { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
      h1 { font-family:"Syne",sans-serif; font-size:clamp(2rem,7vw,4rem); font-weight:800; letter-spacing:-.03em; margin:0 0 1rem; }
      p { color:#9a9a9f; font-size:13px; max-width:34rem; line-height:1.9; }
      a { margin-top:2rem; display:inline-block; text-decoration:none; color:#050505; background:var(--accent); padding:.9rem 2rem; border-radius:999px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; transition:transform .4s, box-shadow .4s; }
      a:hover { transform:translateY(-3px); box-shadow:0 16px 40px -14px var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Non Technical Certificates</h1>
      <p>Sports · Karate · Silambam · Leadership · Events.<br />This collection is being organised and will be published here shortly.</p>
